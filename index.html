<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spread WTI vs Brent | Hyperliquid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0e11;
      color: #eaecef;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e2329;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 0.85rem; color: #848e9c; margin-bottom: 24px; }
    
    .prices {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
      font-size: 1rem;
    }
    .price-box {
      background: #2b3139;
      padding: 12px 16px;
      border-radius: 10px;
      width: 48%;
      text-align: center;
    }
    .price-box .label { font-size: 0.8rem; color: #848e9c; margin-bottom: 4px; }
    .price-box .value { font-size: 1.25rem; font-weight: 600; }

    .spread-section { text-align: center; margin: 20px 0 12px; }
    .spread {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -1px;
    }
    .diff-abs { font-size: 1.1rem; color: #b7bdc6; margin-top: 4px; }
    
    .green { color: #0ecb81; }
    .red { color: #f6465d; }
    .yellow { color: #f0b90b; }

    .recommendation {
      text-align: center;
      font-size: 1.05rem;
      padding: 14px;
      border-radius: 10px;
      background: #2b3139;
      margin: 16px 0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
      font-size: 0.9rem;
    }
    .info-item {
      background: #2b3139;
      padding: 12px 10px;
      border-radius: 8px;
      text-align: center;
    }
    .info-item .label { color: #848e9c; font-size: 0.75rem; }
    .info-item .value { font-weight: 600; margin-top: 3px; }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 0.75rem;
      color: #5e6673;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Spread WTIOIL vs BRENTOIL</h1>
    <div class="subtitle">Hyperliquid (xyz) • Actualiza cada 8s</div>

    <div class="prices">
      <div class="price-box">
        <div class="label">WTIOIL</div>
        <div class="value" id="wti-price">--</div>
      </div>
      <div class="price-box">
        <div class="label">BRENTOIL</div>
        <div class="value" id="brent-price">--</div>
      </div>
    </div>

    <div class="spread-section">
      <div class="spread" id="spread">--</div>
      <div class="diff-abs" id="diff-abs">Diferencia: --</div>
    </div>

    <div class="recommendation" id="recommendation">Cargando...</div>

    <div class="info-grid">
      <div class="info-item">
        <div class="label">Promedio histórico</div>
        <div class="value">≈ 2.00%</div>
      </div>
      <div class="info-item">
        <div class="label">Rango 7 días</div>
        <div class="value" id="range-7d">Calculando...</div>
      </div>
      <div class="info-item">
        <div class="label">Funding WTI (anual)</div>
        <div class="value" id="funding-wti">--</div>
      </div>
      <div class="info-item">
        <div class="label">Funding Brent (anual)</div>
        <div class="value" id="funding-brent">--</div>
      </div>
    </div>

    <div class="footer">
      Datos en tiempo real • dex: xyz
    </div>
  </div>

  <script>
    // === CONFIGURA TUS TARGETS AQUÍ ===
    const ENTER_ABOVE = 3.80;
    const EXIT_BELOW  = 2.30;

    async function fetchCandles(coin, days = 7) {
      const endTime = Date.now();
      const startTime = endTime - (days * 24 * 60 * 60 * 1000);

      const res = await fetch('https://api.hyperliquid.xyz/info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'candleSnapshot',
          req: {
            coin: coin,
            interval: '1h',
            startTime: startTime,
            endTime: endTime
          }
        })
      });
      return await res.json();
    }

    async function updateSpread() {
      try {
        // 1. Precios actuales
        const resMids = await fetch('https://api.hyperliquid.xyz/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'allMids', dex: 'xyz' })
        });
        const mids = await resMids.json();

        const wti = parseFloat(mids['WTIOIL'] || mids['xyz:WTIOIL'] || mids['CL'] || mids['xyz:CL']);
        const brent = parseFloat(mids['BRENTOIL'] || mids['xyz:BRENTOIL']);

        if (!wti || !brent) {
          document.getElementById('recommendation').innerText = 'No se encontraron los símbolos';
          return;
        }

        // Spread actual
        const diff = brent - wti;
        const avg = (brent + wti) / 2;
        const spreadPct = (diff / avg) * 100;

        document.getElementById('wti-price').innerText = '$' + wti.toFixed(3);
        document.getElementById('brent-price').innerText = '$' + brent.toFixed(3);

        const spreadEl = document.getElementById('spread');
        spreadEl.innerText = spreadPct.toFixed(3) + '%';
        document.getElementById('diff-abs').innerText = `Diferencia: $${diff.toFixed(3)}`;

        // Recomendación
        let colorClass = 'yellow';
        let rec = '🟡 Mantener posición / esperar';

        if (spreadPct >= ENTER_ABOVE) {
          colorClass = 'green';
          rec = `🟢 Buena zona para ENTRAR (≥ ${ENTER_ABOVE}%)`;
        } else if (spreadPct <= EXIT_BELOW) {
          colorClass = 'red';
          rec = `🔴 Considera SALIR (≤ ${EXIT_BELOW}%)`;
        }

        spreadEl.className = 'spread ' + colorClass;
        document.getElementById('recommendation').innerText = rec;

        // 2. Funding rates (anualizados)
        try {
          const resCtx = await fetch('https://api.hyperliquid.xyz/info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: 'metaAndAssetCtxs', dex: 'xyz' })
          });
          const ctxData = await resCtx.json();
          const universe = ctxData[0]?.universe || [];
          const ctxs = ctxData[1] || [];

          let fundingWti = '--';
          let fundingBrent = '--';

          universe.forEach((asset, i) => {
            const name = asset.name || '';
            const fundingHourly = parseFloat(ctxs[i]?.funding || 0);
            const fundingAnnual = (fundingHourly * 24 * 365 * 100).toFixed(1) + '%';

            if (name.includes('WTIOIL') || name.includes('CL')) {
              fundingWti = fundingAnnual;
            }
            if (name.includes('BRENTOIL')) {
              fundingBrent = fundingAnnual;
            }
          });

          document.getElementById('funding-wti').innerText = fundingWti;
          document.getElementById('funding-brent').innerText = fundingBrent;
        } catch (e) {
          console.log('Error funding:', e);
        }

        // 3. Rango de los últimos 7 días (máx / mín)
        try {
          const [candlesWti, candlesBrent] = await Promise.all([
            fetchCandles('xyz:WTIOIL', 7),
            fetchCandles('xyz:BRENTOIL', 7)
          ]);

          if (candlesWti.length && candlesBrent.length) {
            // Emparejamos por timestamp lo más cercano posible
            const spreads = [];
            const mapBrent = {};
            candlesBrent.forEach(c => mapBrent[c.T] = parseFloat(c.c));

            candlesWti.forEach(c => {
              const brentClose = mapBrent[c.T];
              if (brentClose) {
                const wtiClose = parseFloat(c.c);
                const s = ((brentClose - wtiClose) / ((brentClose + wtiClose) / 2)) * 100;
                spreads.push(s);
              }
            });

            if (spreads.length > 0) {
              const max = Math.max(...spreads).toFixed(2);
              const min = Math.min(...spreads).toFixed(2);
              document.getElementById('range-7d').innerText = `${min}% → ${max}%`;
            } else {
              document.getElementById('range-7d').innerText = 'Sin datos';
            }
          }
        } catch (e) {
          console.log('Error rango 7d:', e);
          document.getElementById('range-7d').innerText = 'Error';
        }

      } catch (err) {
        console.error(err);
        document.getElementById('recommendation').innerText = 'Error al cargar datos';
      }
    }

    updateSpread();
    setInterval(updateSpread, 8000);
  </script>
</body>
</html>
